<!DOCTYPE html>
<html lang="es" data-hostai-loaded="true" style="--hostai-primary: #1A3A2A; --hostai-secondary: #F5E6C8; --hostai-accent: #D4A547; --hostai-font-heading: 'Playfair Display'; --hostai-font-body: 'Inter';">
<head>
  <title>Casa Pepa · restaurante de mercado en Cáceres</title>
</head>
<body>
  <section data-block-type="hero" data-section-id="s_hero">
    <h1 data-role="headline">Cocina de mercado, alma extremeña</h1>
    <p data-role="subheadline">Producto de proximidad, fuego lento y vinos seleccionados.</p>
    <a data-role="cta" href="/reservas">Reservar mesa</a>
  </section>

  <section data-block-type="text" data-section-id="s_about">
    <p>En el corazón de Cáceres desde 1987, una cocina que cambia con las estaciones.</p>
  </section>

  <section data-block-type="form" data-section-id="s_contact">
    <form data-hostai-form>
      <div data-role="form-field" data-field-type="text">
        <label data-role="field-label">Nombre completo</label>
        <input type="text" name="nombre" required>
      </div>
      <div data-role="form-field" data-field-type="email">
        <label data-role="field-label">Email</label>
        <input type="email" name="email" required>
      </div>
      <div data-role="form-field" data-field-type="tel">
        <label data-role="field-label">Teléfono</label>
        <input type="tel" name="telefono">
      </div>
      <div data-role="form-field" data-field-type="select">
        <label data-role="field-label">Número de comensales</label>
        <select name="comensales" required>
          <option value="2">2 personas</option>
          <option value="4">4 personas</option>
          <option value="6">6 o más</option>
        </select>
      </div>
      <div data-role="form-field" data-field-type="textarea">
        <label data-role="field-label">Alergias o preferencias</label>
        <textarea name="alergias"></textarea>
      </div>
      <button type="submit">Enviar reserva</button>
    </form>
  </section>

  <section data-block-type="footer" data-section-id="s_footer">
    <p>© 2026 Casa Pepa · Cáceres</p>
    <a data-role="contact-email" href="mailto:hola@casapepa.es">hola@casapepa.es</a>
    <a data-role="contact-phone" href="tel:+34927111222">+34 927 111 222</a>
    <ul>
      <li><a data-role="social-link" href="https://instagram.com/casapepa">Instagram</a></li>
      <li><a data-role="social-link" href="https://facebook.com/casapepa">Facebook</a></li>
    </ul>
  </section>
</body>
</html>
