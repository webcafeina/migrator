[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-wp-client"
version = "0.1.0"
description = "Webcafeína Migrator — cliente unificado para WordPress destino (REST + WP-CLI vía SSH)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    "httpx>=0.27",
    "paramiko>=3.4",
    "pydantic>=2.7,<3.0",
    "wcm-shared-types",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests que requieren sandbox WP real (skip si WP_DEFAULT_REST_APP_PASSWORD vacío)",
]
