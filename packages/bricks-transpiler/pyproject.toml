[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-bricks-transpiler"
version = "0.1.0"
description = "Webcafeína Migrator — transpilador ContentBlock → Bricks Builder JSON"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    "pydantic>=2.7,<3.0",
    "wcm-shared-types",
    # v0.22.0 — namespace CSS para el mapper RAW_HTML (Bloque RAW del
    # sprint v0.22.0). Parser robusto necesario para prefijar reglas
    # con `[data-wcm-block]` sin contaminar el resto de la página.
    "tinycss2>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
