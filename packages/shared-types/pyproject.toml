[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-shared-types"
version = "0.1.0"
description = "Webcafeína Migrator — schemas Pydantic v2 compartidos; fuente de los tipos TS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    # `[email]` extra trae `email-validator`, requerido por `EmailStr` en
    # los schemas Lead/User.
    "pydantic[email]>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pydantic-to-typescript>=2.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["python"]

