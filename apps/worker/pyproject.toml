[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-worker"
version = "0.1.0"
description = "Webcafeína Migrator — Celery worker que orquesta los subagentes del producto"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7,<3.0",
    "structlog>=24.4",
    "wcm-shared-types",
    "wcm-db-schema",
    "wcm-scraper-core",
    "wcm-bricks-transpiler",
    "wcm-wp-client",
    "sentence-transformers>=3.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pgvector>=0.3",
    "boto3>=1.40",
    "resend>=2.0",
    "Pillow>=11.0",
    "structlog>=24.4",
    "sentry-sdk[celery]>=2.0",
    "prometheus-client>=0.21",
    "logtail-python>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
