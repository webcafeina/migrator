[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-worker"
version = "0.1.0"
description = "Webcafeína Migrator — Celery worker que orquesta los subagentes del producto"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7,<3.0",
    "structlog>=24.4",
    "wcm-shared-types",
    "wcm-db-schema",
    "wcm-scraper-core",
    "wcm-bricks-transpiler",
    "wcm-wp-client",
    "sentence-transformers>=3.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    # v0.14.0 — pipeline HTML de outreach.
    # `beautifulsoup4` deriva text plain del HTML para fallback de
    # clientes que no renderizan HTML (`text/plain` part del MIME) y
    # para la re-validación legal (que opera sobre texto, no markup).
    # `premailer` inlinea el CSS embebido en `<style>` a atributos
    # `style=""` en cada tag — requisito para Gmail/Outlook que no
    # respetan reglas en `<style>` externos.
    "beautifulsoup4>=4.12",
    "premailer>=3.10.0",
    # v0.16.0 — visual-diff agent (screenshots + comparación pixelmatch)
    # + qa-runner agent (Lighthouse vía subprocess Node, no requiere
    # pip). Playwright requiere `playwright install chromium` + en
    # Linux `playwright install-deps` (docs/despliegue.md). Si no
    # está, el agent marca SKIPPED + crea residual task.
    "playwright>=1.45",
    "pixelmatch>=0.4",
    # v0.16.0 — checklist-generator: PDF entregable al cliente con
    # tareas residuales. WeasyPrint requiere libpango + libcairo en
    # Linux (apt install). En macOS dev viene con brew. Si no está,
    # el agent genera solo el MD + residual task instalación.
    "weasyprint>=68.0",
    # `markdown-it-py` para convertir MD → HTML en el pipeline
    # MD→HTML→PDF de WeasyPrint. Mantiene la fuente de verdad en MD
    # (legible/diffable en review) y deriva HTML para layout.
    "markdown-it-py>=3.0",
    "pgvector>=0.3",
    "boto3>=1.40",
    "resend>=2.0",
    "Pillow>=11.0",
    "structlog>=24.4",
    "sentry-sdk[celery]>=2.0",
    "prometheus-client>=0.21",
    "logtail-python>=0.3",
    # v0.22.0 — Claude Vision para fidelidad visual al origen.
    # ai-assist agent invoca Claude con screenshot + HTML por sección
    # y recibe JSON Bricks nativo. Coste medio ~$0.08/sección con
    # claude-sonnet-4-6. Desactivado del pipeline canónico en v0.23.1.
    "anthropic>=0.40",
    # v0.25.0 — OpenAI gpt-4o para pipeline AI generativo del rediseño.
    # BriefGenerator usa gpt-4o-mini (~$0.01/proyecto). RedesignAIAgent
    # usa gpt-4o con tool_use forzado (~$0.30-1.50/página).
    "openai>=1.40",
    # v0.22.0 — namespace CSS para el fallback RAW_HTML mapper.
    # Parser de CSS necesario para prefijar reglas con `[data-wcm-block]`
    # sin contaminar el resto de la página.
    "tinycss2>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
