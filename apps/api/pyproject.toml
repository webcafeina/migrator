[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcm-api"
version = "0.1.0"
description = "Webcafeína Migrator — API FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Webcafeína S.L.", email = "info@webcafeina.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.0",
    "python-multipart>=0.0.10",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-client>=0.21",
    "logtail-python>=0.3",
    "wcm-shared-types",
    "wcm-db-schema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "freezegun>=1.5",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]  # FastAPI usa Depends() en defaults, es idiomático

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests que requieren Postgres real (skip si DATABASE_SYNC_URL no apunta a uno)",
]
