[pytest]
# Configuración pytest a nivel de monorepo.
# Cada paquete puede tener su propio pyproject.toml con [tool.pytest.ini_options]
# que sobrescribe valores si se ejecuta `pytest` desde dentro del paquete.
# Esto solo aplica cuando se ejecuta desde la raíz (test suite agregado).

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    integration: tests que requieren servicios externos reales (wp sandbox, etc.)
    db: tests que requieren Postgres real con pgvector
    postgres: alias histórico de `db` (paquete db-schema)
    browser: tests que requieren Playwright real instalado
    e2e: tests end-to-end de pipelines completos

# Coverage por defecto desactivado (el suite normal es rápido). Activar con
# `pytest --cov` o `pytest --cov-report=html` para reporte navegable.
# El threshold se aplica solo cuando --cov está activo.
[coverage:run]
branch = True
source =
    packages/bricks-transpiler/src
    packages/db-schema/src
    packages/scraper-core/src
    packages/wp-client/src
    packages/shared-types/python
    apps/api/src
    apps/worker/src
    cli/src

omit =
    */tests/*
    */__pycache__/*
    */__init__.py
    apps/dashboard/*
    */alembic/versions/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    \.\.\.
precision = 1
show_missing = True
skip_covered = False
