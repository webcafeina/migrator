[pytest]
# Configuración pytest a nivel de monorepo.
# Cada paquete puede tener su propio pyproject.toml con [tool.pytest.ini_options]
# que sobrescribe valores si se ejecuta `pytest` desde dentro del paquete.
# Esto solo aplica cuando se ejecuta desde la raíz (test suite agregado).

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    integration: tests que requieren servicios externos reales (wp sandbox, etc.)
    db: tests que requieren Postgres real con pgvector
    postgres: alias histórico de `db` (paquete db-schema)
    browser: tests que requieren Playwright real instalado
