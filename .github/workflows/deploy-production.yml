name: Deploy a producción

# Disparo manual desde Actions UI. Después de push (Fase 15) se puede
# añadir gating con required reviewers + protected environments.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA a desplegar (default: main)'
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH → server, ejecuta deploy.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # El deploy.sh necesita correr como el user WCM (no root), no como
          # el SSH user del runner. Si SSH_USER == WCM_USER esto es directo.
          # Si son distintos, prefijar con `sudo -u webcafeina`.
          script: |
            set -euo pipefail
            cd /home/webcafeina/migrator
            bash infra/deploy/deploy.sh ${{ github.event.inputs.ref }}
