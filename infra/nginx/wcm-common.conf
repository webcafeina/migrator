# /etc/nginx/snippets/wcm-common.conf
#
# Fragmento incluido por los dos vhosts WCM (api + dashboard).
# Centraliza headers de seguridad y SSL params para no duplicarlos.

# ---- Headers de seguridad ----
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP es restrictiva: dashboard solo se sirve a sí mismo + assets CDN
# Cloudflare cuando esté configurado.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;

# ---- TLS hardening ----
# Activado por el vhost que use `include snippets/wcm-common.conf`.
# Asume que cPanel AutoSSL ya colocó los certificados.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:WCM_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# OCSP stapling lo activan los managed configs de cPanel; si no:
# ssl_stapling on; ssl_stapling_verify on;

# Logging común
access_log /var/log/nginx/wcm-access.log;
error_log /var/log/nginx/wcm-error.log warn;

# Body size razonable: el endpoint más pesado es upload de export Bricks JSON.
client_max_body_size 25M;
client_body_timeout 60s;

# Gzip básico (Brotli si el módulo está disponible se añade aparte).
gzip on;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
gzip_proxied any;
gzip_min_length 1024;
