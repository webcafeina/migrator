# /etc/nginx/conf.d/migrator.webcafeina.com.conf
#
# Vhost del dashboard Next.js standalone.
#
# Variables a sustituir:
#   ${WCM_DOMAIN_DASHBOARD}  p.ej. migrator.webcafeina.com
#   ${WCM_PORT_DASHBOARD}    p.ej. 3000
#   ${WCM_APP_DIR}           p.ej. /home/webcafeina/migrator

upstream wcm_dashboard_upstream {
    server 127.0.0.1:${WCM_PORT_DASHBOARD} max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${WCM_DOMAIN_DASHBOARD};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${WCM_DOMAIN_DASHBOARD};

    include snippets/wcm-common.conf;

    ssl_certificate     /var/cpanel/ssl/apache_tls/${WCM_DOMAIN_DASHBOARD}/combined;
    ssl_certificate_key /var/cpanel/ssl/apache_tls/${WCM_DOMAIN_DASHBOARD}/combined;

    # Assets estáticos generados por `next build`: cache largo + immutable.
    # En standalone Next sirve /static via su propio server, pero podemos
    # acelerar sirviéndolos directamente desde disco.
    location /_next/static/ {
        alias ${WCM_APP_DIR}/apps/dashboard/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /public assets (favicon, og:image, etc.)
    location ~ \.(ico|png|jpg|jpeg|svg|webp|woff|woff2|ttf)$ {
        root ${WCM_APP_DIR}/apps/dashboard/public;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @next;
    }

    location @next {
        proxy_pass http://wcm_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://wcm_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
