# /etc/nginx/conf.d/api.migrator.webcafeina.com.conf
#
# Vhost del API. Reverse proxy a uvicorn en 127.0.0.1:${WCM_PORT_API}.
#
# Variables a sustituir:
#   ${WCM_DOMAIN_API}      p.ej. api.migrator.webcafeina.com
#   ${WCM_PORT_API}        p.ej. 8000
#   ${WCM_DOMAIN_DASHBOARD} p.ej. migrator.webcafeina.com

upstream wcm_api_upstream {
    server 127.0.0.1:${WCM_PORT_API} max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP→HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${WCM_DOMAIN_API};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${WCM_DOMAIN_API};

    include snippets/wcm-common.conf;

    # cPanel AutoSSL coloca los certs aquí:
    ssl_certificate     /var/cpanel/ssl/apache_tls/${WCM_DOMAIN_API}/combined;
    ssl_certificate_key /var/cpanel/ssl/apache_tls/${WCM_DOMAIN_API}/combined;

    # CORS lo gestiona la propia API (no duplicarlo aquí).

    # ---- ACL: /metrics solo desde IPs internas + localhost ----
    # Ajusta tras conocer la IP del scraper Prometheus / Grafana Agent.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        # allow <ip-del-grafana-agent>;
        deny all;
        proxy_pass http://wcm_api_upstream;
        proxy_set_header Host $host;
    }

    # ---- ACL: /health/deep solo interno (no anunciar dependencias al mundo) ----
    location = /health/deep {
        allow 127.0.0.1;
        allow ::1;
        # allow <ips-internas-monitoreo>;
        deny all;
        proxy_pass http://wcm_api_upstream;
        proxy_set_header Host $host;
    }

    # /health simple SÍ es público (probe Nginx upstream, k8s readiness, etc.)
    location = /health {
        access_log off;
        proxy_pass http://wcm_api_upstream;
    }

    # Webhooks: rate-limit suave para evitar abuse del endpoint público.
    limit_req_zone $binary_remote_addr zone=wcm_webhooks:10m rate=30r/s;

    location ~ ^/api/v1/webhooks/ {
        limit_req zone=wcm_webhooks burst=60 nodelay;
        proxy_pass http://wcm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Webhooks pueden tardar: timeout generoso.
        proxy_read_timeout 60s;
    }

    # /opt-out es público sin auth (token JWT en query).
    location = /opt-out {
        proxy_pass http://wcm_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Resto de la API
    location / {
        proxy_pass http://wcm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
